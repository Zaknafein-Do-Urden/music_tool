<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="即兴伴奏">
  <meta name="theme-color" content="#14161c">
  <title>即兴伴奏</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
</head>
<body>
  <main class="app">
    <header class="controls">
      <div class="keybar">
        <button class="step" id="key-down" type="button" aria-label="降半音">▼</button>
        <select id="key" aria-label="调"></select>
        <button class="step" id="key-up" type="button" aria-label="升半音">▲</button>
        <div class="seg" id="mode" role="group" aria-label="大调或小调"></div>
      </div>
      <div class="tempo">
        <label class="field meter">
          <span>拍号</span>
          <select id="meter"></select>
        </label>
        <label class="field bpm">
          <span>速度 <b id="bpm-value">80</b></span>
          <input id="bpm" type="range" min="50" max="150" step="1" value="80">
        </label>
      </div>
      <div class="micbar">
        <button class="chip" id="detect-open" type="button">🎤 定调</button>
        <button class="chip" id="suggest-toggle" type="button" aria-pressed="false">💡 推荐</button>
        <button class="chip" id="headphones" type="button" aria-pressed="false">🎧 耳机</button>
        <button class="chip" id="takes-open" type="button">录音 <span id="takes-count">0</span></button>
        <button class="chip icon" id="settings-open" type="button" aria-label="设置">⚙</button>
      </div>
    </header>

    <div class="beats" id="beats" aria-hidden="true"></div>

    <section class="pads" id="pads"></section>

    <div class="toolbar">
      <div class="seg small" id="pattern" role="group" aria-label="伴奏"></div>
      <div class="seg small" id="quantize" role="group" aria-label="换和弦时机"></div>
    </div>

    <footer class="footer">
      <p class="status" id="status">正在加载钢琴音色…</p>
      <button class="fillbtn" id="fill" type="button" aria-pressed="false">✨ 加花</button>
      <button class="rec" id="record" type="button" aria-pressed="false">● 录音</button>
      <button class="stop" id="stop" type="button">停止</button>
    </footer>
  </main>

  <dialog class="sheet" id="detect-dialog">
    <h2>哼几句定调</h2>
    <p class="hint">清唱或哼你想唱的歌 10–20 秒，不用伴奏。唱到乐句结尾的长音最有帮助。</p>
    <div class="live">
      <div>现在的音<b id="detect-note">—</b></div>
      <div>已收集<b id="detect-seconds">0 秒</b></div>
    </div>
    <div class="meter-bar"><i id="detect-progress"></i></div>
    <div class="result" id="detect-result" hidden>
      <p class="big">推荐 <b id="detect-key"></b></p>
      <p id="detect-detail"></p>
    </div>
    <div class="actions">
      <button type="button" id="detect-start" class="primary">开始</button>
      <button type="button" id="detect-apply" class="primary" hidden>用这个调</button>
      <button type="button" id="detect-close">关闭</button>
    </div>
  </dialog>

  <dialog class="sheet" id="settings-dialog">
    <h2>设置</h2>
    <h3>乐队</h3>
    <div class="seg" id="ensemble" role="group" aria-label="乐队"></div>
    <p class="hint" id="ensemble-status"></p>
    <h3>伴奏织体</h3>
    <p class="hint" id="pattern-hint">点名字试听（伴奏中会立刻切换）。点 ★ 选为常用，最多 3 个，显示在主界面底部。</p>
    <div class="plist" id="pattern-list"></div>
    <h3>自动加花</h3>
    <div class="seg small" id="fill-every" role="group" aria-label="自动加花"></div>
    <p class="hint">在小节最后一两拍，每件乐器都来一段过门，下一小节鼓再敲一下镲。也可以随时按主界面的"✨ 加花"。</p>
    <h3>音量</h3>
    <div class="volumes" id="volumes"></div>
    <h3>音色来源</h3>
    <ul class="credits" id="credits"></ul>
    <div class="actions">
      <button type="button" id="settings-close" class="primary">完成</button>
    </div>
  </dialog>

  <dialog class="sheet" id="takes-dialog">
    <h2>录音</h2>
    <p class="hint">刷新页面后录音会消失，喜欢的请及时保存。戴耳机录的效果最好。</p>
    <div id="takes-list"></div>
    <div class="actions">
      <button type="button" id="takes-close">关闭</button>
    </div>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
